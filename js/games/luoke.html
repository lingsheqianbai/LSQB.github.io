<div id="luokeWondersTableContainer"></div>
<div id="luokeTasksTableContainer"></div>
<div id="luokeActivitiesTableContainer"></div>
<div id="luokeTitlesTableContainer"></div>
<div id="luokeChallengesTableContainer"></div>
<div id="luokeMusicTableContainer"></div>

<script>
    (async function() {
        const [wondersRes, tasksRes, activitiesRes, titlesRes, challengesRes, musicRes] = await Promise.all([
            fetch('data/Roco%20Kingdom%20World/wonders.json').catch(() => null),
            fetch('data/Roco%20Kingdom%20World/tasks.json').catch(() => null),
            fetch('data/Roco%20Kingdom%20World/activities.json').catch(() => null),
            fetch('data/Roco%20Kingdom%20World/titles.json').catch(() => null),
            fetch('data/Roco%20Kingdom%20World/challenges.json').catch(() => null),
            fetch('data/Roco%20Kingdom%20World/music.json').catch(() => null)
        ]);
        let wonders = wondersRes && wondersRes.ok ? await wondersRes.json() : [];
        let tasks = tasksRes && tasksRes.ok ? await tasksRes.json() : [];
        let activities = activitiesRes && activitiesRes.ok ? await activitiesRes.json() : [];
        let titles = titlesRes && titlesRes.ok ? await titlesRes.json() : [];
        let challenges = challengesRes && challengesRes.ok ? await challengesRes.json() : [];
        let music = musicRes && musicRes.ok ? await musicRes.json() : [];

        function createTable(containerId, data, columns, title, icon) {
            const container = document.getElementById(containerId);
            if (!data.length) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <details class="section-details">
                    <summary>${icon} ${title} (${data.length}个)</summary>
                    <div class="section-content">
                        <div id="${containerId}_tableContainer">
                            <table class="mod-table" id="${containerId}_table"><thead><tr>${columns.map(c => `<th>${c.label}</th>`).join('')}</tr></thead><tbody></tbody></table>
                            <div id="${containerId}_pagination"></div>
                        </div>
                    </div>
                </details>
            `;
            // 注意：renderSimpleTable 期望的容器 ID 是 table 的 id，pagination 的 id 会自动拼接
            window.renderSimpleTable(`${containerId}_table`, data, columns, 15);
        }

        createTable('luokeWondersTableContainer', wonders, [{ key: 'id', label: '编号' }, { key: 'name', label: '名称' }, { key: 'note', label: '备注' }, { key: 'video', type: 'video', label: '视频' }], '精灵图鉴', '🐉');
        createTable('luokeTasksTableContainer', tasks, [{ key: 'name', label: '任务名' }, { key: 'note', label: '备注' }, { key: 'video', type: 'video', label: '视频' }], '任务攻略', '📜');
        createTable('luokeActivitiesTableContainer', activities, [{ key: 'name', label: '活动名' }, { key: 'note', label: '备注' }, { key: 'video', type: 'video', label: '视频' }], '活动攻略', '🎉');
        createTable('luokeTitlesTableContainer', titles, [{ key: 'name', label: '称号名' }, { key: 'note', label: '备注' }, { key: 'video', type: 'video', label: '视频' }], '称号获取', '🏅');
        createTable('luokeChallengesTableContainer', challenges, [{ key: 'name', label: '挑战名' }, { key: 'note', label: '备注' }, { key: 'video', type: 'video', label: '视频' }], '露天挑战', '🎪');
        createTable('luokeMusicTableContainer', music, [{ key: 'name', label: '音乐名' }, { key: 'note', label: '备注' }, { key: 'video', type: 'video', label: '视频' }], '音乐收集', '🎵');
    })();
</script>
