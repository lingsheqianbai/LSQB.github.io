<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部动态 - 千白分享</title>
    <style>
        /* 完全复用主页的样式（此处与主页样式完全相同，节省篇幅，实际部署时复制完整样式） */
        /* 由于上面已经写了一遍，这里为了完整，直接复制上面的 <style> 内容即可 */
        /* 你可以将 index.html 中的 <style> 整个复制过来，保证左侧栏样式一致 */
    </style>
</head>
<body>
    <nav>
        <ul class="links">
            <li><a href="index.html" style="background-color: #FF4D4D;">主页</a></li>
            <li><a href="moments.html" style="background-color: #FFA500;">动态</a></li>
            <li><a href="#" style="background-color: #FFD700;">项目</a></li>
            <li><a href="#" style="background-color: #32CD32;">作品集</a></li>
            <li><a href="#" style="background-color: #00CED1;">联系</a></li>
            <li><a href="#" style="background-color: #1E90FF;">致谢</a></li>
            <li><a href="https://github.com/lingsheqianbai/lingsheqianbai.github.io" target="_blank" rel="noopener noreferrer" style="background-color: #9370DB;">仓库</a></li>
        </ul>
    </nav>

    <div class="left-col">
        <div class="profile-card">
            <div class="profile-avatar">
                <img src="images/lingsheqianbai.jpg" alt="凌社千白">
            </div>
            <div class="profile-name">凌社千白</div>
            <div class="profile-signature">分享 · 记录 · 创造</div>
            <div class="player">
                <div class="vinyl" id="vinylDisc">
                    <img src="images/yonri.jpg" alt="友利奈绪" class="vinyl-center-img">
                </div>
                <div class="player-controls">
                    <button id="playPauseBtn">▶️</button>
                </div>
                <div class="song-title" id="songTitle">Morning BGM</div>
            </div>
            <button class="theme-toggle" id="themeToggle">🌙 黑夜</button>
        </div>
    </div>

    <div class="right-col">
        <div class="page-header">
            <h2>📰 全部动态</h2>
        </div>
        <div id="momentsList"></div>
        <div id="pagination" class="pagination"></div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        // 音乐播放器（与主页完全一致）
        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const songTitleSpan = document.getElementById('songTitle');

        audio.src = 'music/morning.mp3';
        songTitleSpan.textContent = 'Morning BGM';

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    vinyl.classList.add('playing');
                    playPauseBtn.textContent = '⏸️';
                }).catch(() => {});
            } else {
                audio.pause();
                vinyl.classList.remove('playing');
                playPauseBtn.textContent = '▶️';
            }
        });

        // 主题切换（手动）
        const themeToggle = document.getElementById('themeToggle');
        let isDark = false;
        themeToggle.textContent = '🌙 黑夜';
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            if (isDark) {
                document.body.classList.add('dark');
                themeToggle.textContent = '🌤️ 白天';
            } else {
                document.body.classList.remove('dark');
                themeToggle.textContent = '🌙 黑夜';
            }
        });

        // 动态分页
        let allMoments = [];
        let currentPage = 1;
        const PAGE_SIZE = 10;

        async function loadAllMoments() {
            try {
                const res = await fetch('data/moments.json');
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                allMoments = data.sort((a,b) => new Date(b.time) - new Date(a.time));
                renderPage();
                renderPagination();
            } catch(err) {
                document.getElementById('momentsList').innerHTML = '<div class="moment-item" style="text-align:center;">加载动态失败，请检查 data/moments.json</div>';
            }
        }

        function renderPage() {
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageMoments = allMoments.slice(start, start + PAGE_SIZE);
            if (!pageMoments.length) {
                document.getElementById('momentsList').innerHTML = '<div class="moment-item" style="text-align:center;">暂无动态</div>';
                return;
            }
            let html = '';
            pageMoments.forEach(m => {
                const imagesHtml = (m.images && m.images.length) ? 
                    `<div class="moment-images">${m.images.map(img => `<img src="${img}" alt="配图" loading="lazy" onclick="showImageModal(this.src)">`).join('')}</div>` : '';
                html += `
                    <div class="moment-item">
                        <div class="moment-header">
                            <div class="moment-avatar">${escapeHtml(m.avatar || '📦')}</div>
                            <div class="moment-info">
                                <div class="moment-nickname">${escapeHtml(m.nickname || '凌社千白')}</div>
                                <div class="moment-time">${formatTime(m.time)}</div>
                            </div>
                        </div>
                        <div class="moment-content">${escapeHtml(m.content)}</div>
                        ${imagesHtml}
                        <div class="moment-stats">
                            <span>❤️ ${m.likes || 0}</span>&nbsp;&nbsp;
                            <span>💬 ${m.comments || 0}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('momentsList').innerHTML = html;
        }

        function renderPagination() {
            const totalPages = Math.ceil(allMoments.length / PAGE_SIZE);
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            let html = `<button id="prevPageBtn" ${currentPage === 1 ? 'disabled' : ''}>‹ 上一页</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<span class="page-number ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</span>`;
            }
            html += `<button id="nextPageBtn" ${currentPage === totalPages ? 'disabled' : ''}>下一页 ›</button>`;
            document.getElementById('pagination').innerHTML = html;

            document.querySelectorAll('.page-number').forEach(span => {
                span.addEventListener('click', (e) => {
                    const page = parseInt(e.target.getAttribute('data-page'), 10);
                    if (!isNaN(page) && page !== currentPage) {
                        currentPage = page;
                        renderPage();
                        renderPagination();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            });
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            if (prevBtn) prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderPage();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
            if (nextBtn) nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderPage();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        function formatTime(iso) {
            if (!iso) return '';
            const date = new Date(iso);
            const now = new Date();
            const diff = (now - date) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return `${Math.floor(diff/60)}分钟前`;
            if (diff < 86400) return `${Math.floor(diff/3600)}小时前`;
            if (diff < 86400*7) return `${Math.floor(diff/86400)}天前`;
            return `${date.getMonth()+1}月${date.getDate()}日`;
        }
        window.showImageModal = function(src) {
            const modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';
            modal.style.backgroundColor = 'rgba(0,0,0,0.85)';
            modal.style.display = 'flex';
            modal.style.alignItems = 'center';
            modal.style.justifyContent = 'center';
            modal.style.zIndex = '10000';
            const img = document.createElement('img');
            img.src = src;
            img.style.maxWidth = '90%';
            img.style.maxHeight = '90%';
            img.style.border = '2px solid #fff';
            img.style.borderRadius = '8px';
            modal.appendChild(img);
            modal.addEventListener('click', () => modal.remove());
            document.body.appendChild(modal);
        };

        loadAllMoments();
    </script>
</body>
</html>
