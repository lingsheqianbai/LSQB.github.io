    <style>

        ::-webkit-scrollbar-button:vertical:start { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='16' height='17' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 0H0v16h1V1h14V0z' fill='%23DFDFDF'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M2 1H1v14h1V2h12V1H2z' fill='%23fff'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M16 17H0v-1h15V0h1v17z' fill='%23000'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 1h-1v14H1v1h14V1z' fill='gray'/%3E%3Cpath fill='silver' d='M2 2h12v13H2z'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M8 6H7v1H6v1H5v1H4v1h7V9h-1V8H9V7H8V6z' fill='%23000'/%3E%3C/svg%3E"); height: 17px; }

        ::-webkit-scrollbar-button:horizontal:end { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='16' height='17' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 0H0v16h1V1h14V0z' fill='%23DFDFDF'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M2 1H1v14h1V2h12V1H2z' fill='%23fff'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M16 17H0v-1h15V0h1v17z' fill='%23000'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 1h-1v14H1v1h14V1z' fill='gray'/%3E%3Cpath fill='silver' d='M2 2h12v13H2z'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M7 4H6v7h1v-1h1V9h1V8h1V7H9V6H8V5H7V4z' fill='%23000'/%3E%3C/svg%3E"); width: 16px; }
        ::selection { color: #b4dffb; background: #ffffe0; }

        nav { width: 100%; position: fixed; top: 0; z-index: 999; font-size: 72%; }
        nav .links {
            padding: 3.5px 16px; list-style: none; padding-inline: 0 !important; padding-bottom: 0 !important; padding-top: 5px !important;
            border-bottom: 2px solid var(--border-color); background: #fff; margin: 0; text-align: center;
        }
        nav .links li { display: inline-block; min-height: 1.4em; list-style: none; }
        nav .links li a {
            font-size: 0; width: 70px; border-radius: 10px 10px 0 0; border: 1px solid var(--border-color); transform: translateY(1px);
            padding: 3px 8px; background: var(--pink-light); white-space: nowrap; margin: 0 1px; display: inline-block;
            font-family: SimSun, "Microsoft YaHei", sans-serif; font-weight: 400 !important; text-decoration: none !important;
            box-shadow: 0 -2px 2px 3px rgba(255,255,255,0.5) inset; color: #fff !important;
            text-shadow: 1px 1px 0 color-mix(in srgb, #f9bddd 70%, #000);
        }
        nav .links li a:after { content: attr(data-label); font-size: 13px; }
        nav .links li a:hover, nav .links li.active a { background: var(--pink); }
        nav .links li.active a { font-weight: bold; }

        main { background: none; font-size: 80%; }
        .left-col { padding: 5px; top: var(--nav-offset); width: var(--sidebar-width); position: fixed; left: var(--layout-gap); z-index: 950; }
        .left-col .profile-title {
            position: fixed; left: var(--layout-gap); top: 48px; background: var(--pink); width: var(--sidebar-width);
            padding: 6px 10px; border-radius: 10px 10px 0 0; box-shadow: 0 -5px 3px 3px rgba(255,255,255,0.5) inset;
            border: 1px solid var(--border-color); color: #fff !important; text-shadow: 1px 1px 0 color-mix(in srgb, #f9bddd 70%, #000);
            font-size: 1.2em; margin: 0; text-align: center; font-weight: bold; z-index: 952;
        }
        .profile-card {
            background: #fff; border: 1px solid var(--border-color); border-radius: 0 0 10px 10px; padding: 12px 10px;
            position: fixed; left: var(--layout-gap); top: 77px; width: var(--sidebar-width); z-index: 951;
        }
        .profile-card .avatar-area { text-align: center; margin-bottom: 10px; }
        .profile-card .avatar-icon { font-size: 48px; display: block; }
        .profile-card .profile-name { font-weight: bold; font-size: 14px; color: var(--text-dark); margin-top: 4px; }
        .profile-card .profile-status { color: color-mix(in srgb, #4045ff 50%, #000); font-size: 11px; }
        .profile-card .profile-note {
            margin-top: 8px; padding: 8px 10px; border: 2px solid #8d6e6888; border-radius: 12px;
            background: linear-gradient(180deg, #fff6f9 0%, #fff 45%, #fdf3ff 100%); color: #3b2b2b; font-size: 11px; line-height: 1.4;
        }
        .profile-card .side-link {
            display: block; text-align: center; padding: 5px; margin-top: 8px;
            background: var(--pink-light); border: 1px solid var(--border-color); border-radius: 6px;
            color: var(--pink-dark) !important; text-decoration: none; font-size: 11px; font-weight: bold;
        }
        .profile-card .side-link:hover { background: var(--pink); }

        .col.right {
            display: block; background: #fff; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);
            position: relative; width: calc(100% - var(--sidebar-width) - (var(--layout-gap) * 2)); max-width: 1000px;
            min-height: calc(100vh - var(--nav-offset)); margin-left: calc(var(--sidebar-width) + (var(--layout-gap) * 2));
            margin-top: var(--nav-offset); margin-right: var(--layout-gap); overflow-y: auto; overflow-x: hidden;
            padding: 0 10px 20px; z-index: 900;
        }

        .block { margin: 10px 0; }
        .block .heading {
            background: #f9bddd; border: 1px solid #000; border-bottom: 0; border-radius: 10px 10px 0 0; padding: 2px 7px; color: #fff;
            text-shadow: 0 0 1px color-mix(in srgb, #f9bddd 70%, #000), 1px 1px 0 color-mix(in srgb, #f9bddd 70%, #000), -1px -1px 0 color-mix(in srgb, #f9bddd 70%, #000);
            display: flex; align-items: center; gap: 8px;
        }
        .block .heading h4 { font-size: 14px !important; display: inline !important; font-weight: normal; }
        .block .inner { border: 1px solid #000; border-radius: 0 0 10px 10px; background: #fff; padding: 12px; }

        .archive-hero {
            background: linear-gradient(135deg, rgba(249,189,221,0.25) 0%, rgba(180,223,251,0.2) 50%, rgba(249,189,221,0.15) 100%),
                        repeating-conic-gradient(#f9bddd22 0% 25%, transparent 0% 50%) 50% / 40px 40px;
            background-size: auto, 40px 40px; border-bottom: 2px solid var(--border-color);
            padding: 24px 20px 18px; margin: 0 -10px 10px; position: relative; overflow: hidden;
        }
        .archive-hero::before { content: ""; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(249,189,221,0.45) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
        .archive-hero-title { font-family: SimSun, "Microsoft YaHei", monospace; font-size: 24px; font-weight: bold; color: var(--border-color); margin: 0 0 4px; text-shadow: 2px 2px 0 rgba(249,189,221,0.5); }
        .archive-hero-sub { font-size: 12px; color: var(--text-mid); margin: 0; }
        .archive-hero-deco { display: flex; align-items: center; gap: 6px; width: 100px; margin-top: 8px; }
        .archive-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--pink-dark); flex-shrink: 0; }
        .archive-line { flex: 1; height: 1.5px; background: linear-gradient(90deg, #c44569, #f9bddd, #b4dffb); }
        .total-count { display: inline-block; margin-top: 10px; padding: 3px 12px; border: 1px solid var(--pink-dark); border-radius: 12px; font-size: 11px; color: var(--pink-dark); background: rgba(255,255,255,0.5); }

        .archive-year-header { display: flex; align-items: center; gap: 10px; margin: 20px 0 6px; }
        .archive-year-header:first-child { margin-top: 4px; }
        .archive-year-label { font-family: SimSun, "Microsoft YaHei", monospace; font-size: 16px; font-weight: bold; color: var(--text-dark); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .archive-year-label .year-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink-dark); flex-shrink: 0; }
        .archive-year-count { font-size: 11px; color: var(--text-light); font-weight: normal; }
        .archive-year-line { flex: 1; height: 1px; background: #e0cfd6; }

        .archive-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 2px 0 8px; }
        .archive-card {
            background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 14px;
            display: flex; flex-direction: column; gap: 6px; transition: transform .25s ease, box-shadow .25s ease;
            animation: archiveCardIn .4s ease both; text-decoration: none; color: inherit;
        }
        @keyframes archiveCardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .archive-card:nth-child(1) { animation-delay: 0s; } .archive-card:nth-child(2) { animation-delay: .05s; } .archive-card:nth-child(3) { animation-delay: .1s; } .archive-card:nth-child(4) { animation-delay: .15s; } .archive-card:nth-child(5) { animation-delay: .2s; } .archive-card:nth-child(6) { animation-delay: .25s; } .archive-card:nth-child(7) { animation-delay: .3s; } .archive-card:nth-child(8) { animation-delay: .35s; }
        .archive-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(196,69,105,0.1), 0 2px 6px rgba(0,0,0,0.05); }
        .archive-card-title { font-size: 14px; font-weight: bold; color: var(--text-dark); margin: 0; line-height: 1.3; transition: color .2s; }
        .archive-card:hover .archive-card-title { color: var(--pink-dark); }
        .archive-card-date { font-size: 10px; color: var(--text-light); font-family: Consolas, monospace; }
        .archive-card-desc { font-size: 11px; color: var(--text-mid); line-height: 1.5; margin: 0; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .archive-card-action { margin-top: auto; padding-top: 2px; }
        .archive-card-link { font-family: SimSun, "Microsoft YaHei", monospace; font-size: 10px; color: var(--pink-tag); text-decoration: none; border-bottom: 1px dashed transparent; transition: color .2s, border-color .2s; }
        .archive-card-link:hover { color: var(--pink-dark); border-bottom-color: var(--pink-dark); }

        .page-end { display: flex; align-items: center; gap: 12px; padding: 16px 0 10px; }
        .page-end-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #e0cfd6, transparent); }
        .page-end-text { font-size: 10px; color: var(--text-light); white-space: nowrap; }
        .loading-text { text-align: center; padding: 30px; color: var(--text-light); font-size: 12px; }

        @media (max-width: 860px) {
            .left-col { display: none !important; }
            .col.right { width: 100%; margin-left: 0; margin-right: 0; border-left: none; border-right: none; border-top: 1px solid var(--border-color); padding: 0 4px 10px; }
            nav { position: sticky; }
            nav .links { padding: 3.5px 4px; } nav .links li a { width: 56px; } nav .links li a:after { font-size: 11px; }
            .archive-hero { margin: 0 -4px 10px; padding: 18px 12px 14px; }
            .archive-hero-title { font-size: 20px; }
            .archive-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <ul class="links">
            <li><a href="index.html" data-label="主页"></a></li>
            <li><a href="post.html" data-label="帖子"></a></li>
            <li class="active"><a href="archive.html" data-label="归档"></a></li>
            <li><a href="index.html#contact" data-label="联系"></a></li>
        </ul>
    </nav>

    <main>
        <div class="left-col profile">
            <div class="profile-title">千白分享</div>
            <div class="profile-card">
                <div class="avatar-area"><span class="avatar-icon">📚</span><div class="profile-name">凌社千白</div><div class="profile-status">● ONLINE!</div></div>
                <div class="profile-note">这里是千白的文章归档页面，记录所有帖子和分享内容。感谢你的来访 ♥</div>
                <a href="index.html" class="side-link">← 返回首页</a>
            </div>
        </div>

        <div class="col right">
            <div class="archive-hero">
                <h2 class="archive-hero-title">文章归档</h2>
                <p class="archive-hero-sub">Archive —— 所有文章的年份月度索引</p>
                <div class="archive-hero-deco"><span class="archive-dot"></span><span class="archive-line"></span><span class="archive-dot"></span></div>
                <div class="total-count" id="totalCount">加载中...</div>
            </div>

            <div id="archiveContent"><div class="loading-text">正在加载文章归档...</div></div>

            <div class="page-end"><span class="page-end-line"></span><span class="page-end-text">- 已经到底了 -</span><span class="page-end-line"></span></div>
        </div>
    </main>

    <script>
        var MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
        function parseDate(d) { if(!d) return null; var p=d.split('-'); if(p.length<3) return null; var y=parseInt(p[0],10),m=parseInt(p[1],10),dd=parseInt(p[2],10); if(isNaN(y)||isNaN(m)||isNaN(dd)) return null; return {year:y,month:m,day:dd}; }
        function formatDate(d) { var p=parseDate(d); if(!p) return '--'; return String(p.month).padStart(2,'0')+'-'+String(p.day).padStart(2,'0'); }
        function esc(s) { if(!s) return ''; var d=document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
        function groupByYearMonth(posts) {
            var ym={}; posts.forEach(function(post) { var p=parseDate(post.date); if(!p) return; if(!ym[p.year]) ym[p.year]={}; if(!ym[p.year][p.month]) ym[p.year][p.month]=[]; ym[p.year][p.month].push(post); });
            var r=[]; Object.keys(ym).sort(function(a,b){return b-a}).forEach(function(year) {
                var mm=ym[year]; var ms=Object.keys(mm).sort(function(a,b){return b-a}).map(function(month) {
                    return { month:parseInt(month,10), monthName:MONTH_NAMES[parseInt(month,10)-1], posts:mm[month].sort(function(a,b){return new Date(b.date)-new Date(a.date)}) };
                }); r.push({year:parseInt(year,10), months:ms});
            }); return r;
        }
        function renderArchive(posts) {
            var g=groupByYearMonth(posts);
            document.getElementById('totalCount').textContent = '\u5171 ' + posts.length + ' \u7BC7\u6587\u7AE0';
            if(g.length===0) { document.getElementById('archiveContent').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-light);font-size:13px">📭 暂无文章</div>'; return; }
            var h=''; g.forEach(function(yg) { var yc=0; yg.months.forEach(function(m){yc+=m.posts.length});
                h+='<div class="archive-year-header"><div class="archive-year-label"><span class="year-dot"></span>'+yg.year+'<span class="archive-year-count">\uFF08'+yc+'\u7BC7\uFF09</span></div><div class="archive-year-line"></div></div>';
                h+='<div class="archive-grid">';
                yg.months.forEach(function(mg) { mg.posts.forEach(function(post) {
                    var link=post.link||('post.html?id='+encodeURIComponent(post.id));
                    var sum=post.summary||''; if(sum.length>80) sum=sum.substring(0,80)+'\u2026';
                    h+='<a class="archive-card" href="'+esc(link)+'"><span class="archive-card-date">'+mg.monthName+' '+esc(formatDate(post.date))+'</span><div class="archive-card-title">'+esc(post.title)+'</div>'+(sum?'<p class="archive-card-desc">'+esc(sum)+'</p>':'')+'<div class="archive-card-action"><span class="archive-card-link">\u67E5\u770B\u8BE6\u60C5 \u2192</span></div></a>';
                })}); h+='</div>';
            }); document.getElementById('archiveContent').innerHTML=h;
        }
        function renderError(msg) { document.getElementById('archiveContent').innerHTML='<div style="text-align:center;padding:40px;color:#c0392b;font-size:13px">✖ '+esc(msg)+'</div>'; document.getElementById('totalCount').textContent='\u52A0\u8F7D\u5931\u8D25'; }
        fetch('data/posts.json').then(function(r){return r.json()}).then(function(posts) { posts.sort(function(a,b){return new Date(b.date)-new Date(a.date)}); renderArchive(posts); }).catch(function(e) { console.error(e); renderError('\u6570\u636E\u52A0\u8F7D\u5931\u8D25'); });
    </script>
</body>
</html>
