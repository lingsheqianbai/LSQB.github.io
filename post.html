<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>帖子详情 - 千白分享</title>
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
    <script>LA.init({id:"3PEh97IIsQ2zJUR2",ck:"3PEh97IIsQ2zJUR2"})</script>
    <style>
        :root {
            --sidebar-width: 250px; --layout-gap: 14px; --nav-offset: 46px;
            --pink: #f9bddd; --pink-dark: #c44569; --pink-light: #ffcfe2;
            --text-dark: #2a1a2e; --text-mid: #5a3e4b; --text-light: #bba3ad;
            --border-color: #000;
        }
        @font-face {
            font-family: 'ZQKNNY';
            src: url('ZQKNNY-Medium-2.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { line-height: 1.2; }
        body {
            position: relative; overflow-x: hidden; overflow-y: auto;
            font-family: "MS PGothic", "Unifont", "SimSun", "Microsoft YaHei", "ZQKNNY", sans-serif;
            background: navajowhite;
            background-image: repeating-conic-gradient(#f9bddd33 0% 25%, transparent 0% 50%) 50% / 40px 40px;
            background-attachment: fixed;
            margin: 0; padding: 0; min-height: 100vh; width: 100%;
        }
        ::-webkit-scrollbar { width: 16px; }
        ::-webkit-scrollbar:horizontal { height: 17px; }
        ::-webkit-scrollbar-corner { background: #dfdfdf; }
        ::-webkit-scrollbar-track { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='2' height='2' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M1 0H0v1h1v1h1V1H1V0z' fill='silver'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M2 0H1v1H0v1h1V1h1V0z' fill='%23fff'/%3E%3C/svg%3E"); }
        ::-webkit-scrollbar-thumb { background-color: #dfdfdf; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px grey, inset 2px 2px #dfdfdf; }
        ::-webkit-scrollbar-button:vertical:start { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='16' height='17' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 0H0v16h1V1h14V0z' fill='%23DFDFDF'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M2 1H1v14h1V2h12V1H2z' fill='%23fff'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M16 17H0v-1h15V0h1v17z' fill='%23000'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 1h-1v14H1v1h14V1z' fill='gray'/%3E%3Cpath fill='silver' d='M2 2h12v13H2z'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M8 6H7v1H6v1H5v1H4v1h7V9h-1V8H9V7H8V6z' fill='%23000'/%3E%3C/svg%3E"); height: 17px; }
        ::-webkit-scrollbar-button:vertical:end { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='16' height='17' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 0H0v16h1V1h14V0z' fill='%23DFDFDF'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M2 1H1v14h1V2h12V1H2z' fill='%23fff'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M16 17H0v-1h15V0h1v17z' fill='%23000'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 1h-1v14H1v1h14V1z' fill='gray'/%3E%3Cpath fill='silver' d='M2 2h12v13H2z'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M11 6H4v1h1v1h1v1h1v1h1V9h1V8h1V7h1V6z' fill='%23000'/%3E%3C/svg%3E"); height: 17px; }
        ::-webkit-scrollbar-button:horizontal:start { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='16' height='17' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 0H0v16h1V1h14V0z' fill='%23DFDFDF'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M2 1H1v14h1V2h12V1H2z' fill='%23fff'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M16 17H0v-1h15V0h1v17z' fill='%23000'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 1h-1v14H1v1h14V1z' fill='gray'/%3E%3Cpath fill='silver' d='M2 2h12v13H2z'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M9 4H8v1H7v1H6v1H5v1h1v1h1v1h1v1h1V4z' fill='%23000'/%3E%3C/svg%3E"); width: 16px; }
        ::-webkit-scrollbar-button:horizontal:end { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='16' height='17' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 0H0v16h1V1h14V0z' fill='%23DFDFDF'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M2 1H1v14h1V2h12V1H2z' fill='%23fff'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M16 17H0v-1h15V0h1v17z' fill='%23000'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M15 1h-1v14H1v1h14V1z' fill='gray'/%3E%3Cpath fill='silver' d='M2 2h12v13H2z'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M7 4H6v7h1v-1h1V9h1V8h1V7H9V6H8V5H7V4z' fill='%23000'/%3E%3C/svg%3E"); width: 16px; }
        ::selection { color: #b4dffb; background: #ffffe0; }

        /* NAV */
        nav { width: 100%; position: fixed; top: 0; z-index: 999; font-size: 72%; }
        nav .links {
            padding: 3.5px 16px; list-style: none;
            padding-inline: 0 !important; padding-bottom: 0 !important; padding-top: 5px !important;
            border-bottom: 2px solid var(--border-color); background: #fff; margin: 0; text-align: center;
        }
        nav .links li { display: inline-block; min-height: 1.4em; list-style: none; }
        nav .links li a {
            font-size: 0; width: 70px; border-radius: 10px 10px 0 0;
            border: 1px solid var(--border-color); transform: translateY(1px);
            padding: 3px 8px; background: var(--pink-light); white-space: nowrap;
            margin: 0 1px; display: inline-block;
            font-family: SimSun, "Microsoft YaHei", sans-serif;
            font-weight: 400 !important; text-decoration: none !important;
            box-shadow: 0 -2px 2px 3px rgba(255,255,255,0.5) inset;
            color: #fff !important;
            text-shadow: 1px 1px 0 color-mix(in srgb, #f9bddd 70%, #000);
        }
        nav .links li a:after { content: attr(data-label); font-size: 13px; }
        nav .links li a:hover, nav .links li.active a { background: var(--pink); }
        nav .links li.active a { font-weight: bold; }

        /* MAIN LAYOUT */
        main { background: none; font-size: 80%; }
        .left-col { padding: 5px; top: var(--nav-offset); width: var(--sidebar-width); position: fixed; left: var(--layout-gap); z-index: 950; }
        /* 右侧目录 */
        .toc-col { position: fixed; right: var(--layout-gap); top: var(--nav-offset); width: 200px; z-index: 940; }
        .toc-card { background: #fff; border: 1px solid var(--border-color); border-radius: 0 0 10px 10px; padding: 12px; font-size: 12px; }
        .toc-card .toc-title { font-weight: bold; font-size: 13px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #ddd; }
        .toc-card a { display: block; padding: 3px 6px; color: var(--text-dark); text-decoration: none; border-radius: 4px; margin: 2px 0; }
        .toc-card a:hover, .toc-card a.active { background: var(--pink-light); color: var(--pink-dark); }
        @media (max-width: 1200px) { .toc-col { display: none; } }
        .left-col .profile-title {
            position: fixed; left: var(--layout-gap); top: 48px;
            background: var(--pink); width: var(--sidebar-width);
            padding: 6px 10px; border-radius: 10px 10px 0 0;
            box-shadow: 0 -5px 3px 3px rgba(255,255,255,0.5) inset;
            border: 1px solid var(--border-color); color: #fff !important;
            text-shadow: 1px 1px 0 color-mix(in srgb, #f9bddd 70%, #000);
            font-size: 1.2em; margin: 0; text-align: center; font-weight: bold; z-index: 952;
        }
        .profile-card {
            background: #fff; border: 1px solid var(--border-color);
            border-radius: 0 0 10px 10px; padding: 12px 10px;
            position: fixed; left: var(--layout-gap); top: 77px;
            width: var(--sidebar-width); z-index: 951;
        }
        .profile-card .avatar-area { text-align: center; margin-bottom: 10px; }
        .profile-card .avatar-icon { font-size: 48px; display: block; }
        .profile-card .profile-name { font-weight: bold; font-size: 14px; color: var(--text-dark); margin-top: 4px; }
        .profile-card .profile-status { color: color-mix(in srgb, #4045ff 50%, #000); font-size: 11px; }
        .profile-card .profile-note {
            margin-top: 8px; padding: 8px 10px; border: 2px solid #8d6e6888; border-radius: 12px;
            background: linear-gradient(180deg, #fff6f9 0%, #fff 45%, #fdf3ff 100%);
            color: #3b2b2b; font-size: 11px; line-height: 1.4;
        }
        .profile-card .side-link {
            display: block; text-align: center; padding: 5px; margin-top: 8px;
            background: var(--pink-light); border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--pink-dark) !important;
            text-decoration: none; font-size: 11px; font-weight: bold;
        }
        .profile-card .side-link:hover { background: var(--pink); }

        .col.right {
            display: block; background: #fff;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            position: relative;
            width: calc(100% - var(--sidebar-width) - (var(--layout-gap) * 2));
            max-width: 900px;
            min-height: calc(100vh - var(--nav-offset));
            margin-left: calc(var(--sidebar-width) + (var(--layout-gap) * 2));
            margin-top: var(--nav-offset);
            margin-right: var(--layout-gap);
            overflow-y: auto; overflow-x: hidden;
            padding: 0 10px 20px;
            z-index: 900;
        }

        /* BLOCK STYLE */
        .block { margin: 10px 0; }
        .block .heading {
            background: #f9bddd; border: 1px solid #000; border-bottom: 0;
            border-radius: 10px 10px 0 0; padding: 2px 7px; color: #fff;
            text-shadow: 0 0 1px color-mix(in srgb, #f9bddd 70%, #000), 1px 1px 0 color-mix(in srgb, #f9bddd 70%, #000), -1px -1px 0 color-mix(in srgb, #f9bddd 70%, #000);
            display: flex; align-items: center; gap: 8px;
        }
        .block .heading h4 { font-size: 14px !important; display: inline !important; font-weight: normal; }
        .block .inner {
            border: 1px solid #000; border-radius: 0 0 10px 10px;
            background: #fff; padding: 16px;
        }

        /* ARTICLE STYLES */
        .article-container { font-size: 13px; line-height: 1.7; color: var(--text-dark); }
        .article-container h2 {
            font-size: 1.3rem; font-weight: bold; margin: 1.5rem 0 .8rem;
            padding-bottom: .3rem; border-bottom: 1px solid #e0cfd6; color: var(--text-dark);
        }
        .article-container h3 { font-size: 1.1rem; font-weight: bold; margin: 1.2rem 0 .6rem; color: var(--text-dark); }
        .article-container p { margin: 0 0 .8rem; }
        .article-container img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #e0cfd6; margin: .8rem 0; }
        .article-container a { color: var(--pink-dark); text-decoration: none; }
        .article-container a:hover { text-decoration: underline; }
        .article-container blockquote {
            margin: .8rem 0; padding: .5rem 0 .5rem 1rem;
            border-left: 4px solid var(--pink-dark); background: #fffbfd;
            border-radius: 0 6px 6px 0; color: var(--text-mid); font-style: italic;
        }
        .article-container code { background: #fff0f5; padding: .2rem .4rem; border-radius: 4px; font-family: monospace; font-size: .9em; }
        .article-container pre { background: #fdf6f9; padding: .8rem; border-radius: 6px; overflow-x: auto; border: 1px solid #f0dce4; font-size: .8rem; margin: .8rem 0; }
        .article-container pre code { background: none; padding: 0; }
        .article-container ul, .article-container ol { margin: 0 0 .8rem 1.5rem; }
        .article-container li { margin: .3rem 0; }

        .post-meta { font-size: 11px; color: var(--text-light); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 10px; }
        .post-copyright { font-size: 10px; color: var(--text-light); line-height: 1.6; margin-top: 8px; }
        .post-copyright a { color: var(--pink-dark); }
        .loading-text { text-align: center; padding: 30px; color: var(--text-light); font-size: 12px; }

        @media (max-width: 768px) {
            .left-col { display: none !important; }
            .col.right { width: 100%; margin-left: 0; margin-right: 0; border-left: none; border-right: none; border-top: 1px solid var(--border-color); padding: 0 4px 10px; }
            nav { position: sticky; }
            nav .links { padding: 3.5px 4px; }
            nav .links li a { width: 56px; }
            nav .links li a:after { font-size: 11px; }
        }
    </style>
</head>
<body>
    <nav>
        <ul class="links">
            <li><a href="index.html" data-label="主页"></a></li>
            <li><a href="moments.html" data-label="动态"></a></li>
            <li><a href="projects.html" data-label="项目"></a></li>
            <li><a href="works.html" data-label="作品集"></a></li>
            <li><a href="posts.html" data-label="帖子"></a></li>
            <li><a href="thanks.html" data-label="致谢"></a></li>
            <li><a href="repo.html" data-label="仓库"></a></li>
        </ul>
    </nav>

    <main>
        <div class="left-col profile">
            <div class="profile-title">千白分享</div>
            <div class="profile-card">
                <div class="avatar-area"><span class="avatar-icon">📖</span><div class="profile-name">凌社千白</div><div class="profile-status">● ONLINE!</div></div>
                <div class="profile-note">阅读帖子详情。</div>
                <a href="posts.html" id="backLink" class="side-link">← 返回帖子列表</a>
                <a href="javascript:history.back()" class="side-link">← 返回上一页</a>
            </div>
        </div>

        <div class="toc-col">
            <div class="toc-card">
                <div class="toc-title">📑 目录</div>
                <div id="tocList"></div>
            </div>
        </div>

        <div class="col right">
            <div class="block">
                <div class="heading"><h4>📖 帖子详情</h4></div>
                <div class="inner">
                    <h2 id="postTitle" style="font-size:1.4rem;font-weight:bold;color:var(--text-dark);margin:0 0 4px;">加载中...</h2>
                    <div class="post-meta" id="postMeta"></div>
                    <hr style="border:none;border-top:1px solid #e0cfd6;margin:10px 0">
                    <div class="article-container" id="articleContainer"><p class="loading-text">加载中...</p></div>
                    <hr style="border:none;border-top:1px solid #e0cfd6;margin:10px 0">
                    <div class="post-copyright" id="postCopyright">
                        <span>文章作者: 凌社千白</span><br>
                        <span id="postLinkSpan">文章链接: <a id="postLink" href="#">加载中</a></span><br>
                        <span>版权声明: 本作品采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a> 许可协议。转载请注明出处。</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) {
            document.getElementById('postTitle').textContent = '未指定帖子';
            document.getElementById('articleContainer').innerHTML = '<p>请从帖子列表页点击进入。</p>';
        } else {
            (async () => {
                const sources = [
                    'data/posts.json',
                    'data/Project%20Zomboid/mod_posts.json',
                    'data/Minecraft/mod_posts.json'
                ];
                let post = null;
                for (const src of sources) {
                    try {
                        const res = await fetch(src);
                        if (!res.ok) continue;
                        const data = await res.json();
                        post = data.find(p => p.id == postId);
                        if (post) break;
                    } catch(e) { continue; }
                }
                if (post) {
                    document.title = post.title + ' - 千白分享';
                    document.getElementById('postTitle').textContent = post.title;
                    document.getElementById('postMeta').innerHTML = `<span>📅 发布时间：${post.date}</span>`;
                    document.getElementById('articleContainer').innerHTML = post.content;
                    // 构建目录
                    setTimeout(() => {
                        const h2s = document.querySelectorAll('.article-container h2');
                        const toc = document.getElementById('tocList');
                        if (h2s.length && toc) {
                            let html = '';
                            h2s.forEach((h, i) => {
                                const id = 'sec-' + i;
                                h.id = id;
                                html += `<a href="#${id}" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'});return false">${h.textContent}</a>`;
                            });
                            toc.innerHTML = html;
                        }
                    }, 100);
                    document.getElementById('postLink').href = window.location.href;
                    document.getElementById('postLink').textContent = window.location.href;
                    const backLink = document.getElementById('backLink');
                    if (post.id && post.id.startsWith('changelog-')) {
                        backLink.href = 'repo.html';
                        backLink.textContent = '← 返回仓库';
                    } else {
                        backLink.href = 'posts.html';
                        backLink.textContent = '← 返回帖子列表';
                    }
                } else {
                    document.getElementById('postTitle').textContent = '未找到该帖子';
                    document.getElementById('articleContainer').innerHTML = '<p>帖子不存在或已被删除。</p>';
                }
            })().catch(err => {
                console.error(err);
                document.getElementById('postTitle').textContent = '加载失败';
                document.getElementById('articleContainer').innerHTML = '<p>数据加载失败</p>';
            });
        }
    </script>
</body>
</html>
