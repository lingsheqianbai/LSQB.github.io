<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 - 千白分享</title>
    <style>
        :root {
            --sidebar-width: 260px; --nav-offset: 60px; --border-color: #000;
            --bg-card: #fff; --bg-sidebar: #fff; --text-dark: #2a1a2e;
            --text-mid: #5a3e4b; --text-light: #bba3ad; --shadow: 4px 4px 0 rgba(0,0,0,0.1);
            --pink: #f9bddd; --pink-dark: #c44569; --pink-light: #ffcfe2;
        }
        @font-face { font-family:'ZQKNNY'; src:url('ZQKNNY-Medium-2.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:swap; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:"MS PGothic","Unifont","SimSun","Microsoft YaHei","ZQKNNY",sans-serif;
            background:url('images/beijin1.jpg') no-repeat center center fixed; background-size:cover;
            min-height:100vh; padding-top:var(--nav-offset); color:var(--text-dark);
        }
        nav { width:100%; position:fixed; top:0; z-index:999; background:#fff; border-bottom:2px solid #000; }
        nav .links { display:flex; flex-wrap:wrap; justify-content:center; list-style:none; padding:8px 16px; margin:0; gap:12px; }
        nav .links li a { display:inline-block; padding:8px 32px; border-radius:32px; border:1px solid #000; font-size:14px; font-weight:bold; text-decoration:none; color:#fff; text-shadow:0 0 3px rgba(0,0,0,0.5); transition:filter 0.2s; cursor:pointer; }
        nav .links li a:hover { filter:brightness(0.85); }
        .left-col { position:fixed; left:20px; top:var(--nav-offset); width:var(--sidebar-width); z-index:950; }
        .profile-card { background:var(--bg-sidebar); border:1px solid var(--border-color); border-radius:12px; padding:16px; box-shadow:var(--shadow); }
        .profile-avatar { text-align:center; margin-bottom:8px; }
        .profile-avatar img { width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--border-color); }
        .profile-name { font-size:18px; font-weight:bold; text-align:center; }
        .profile-signature { font-size:11px; text-align:center; color:var(--text-mid); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-color); }
        .player { margin:16px 0 12px; text-align:center; }
        .vinyl { position:relative; width:80px; height:80px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 35% 35%, #222, #111); border-radius:50%; box-shadow:0 0 0 4px #444, 0 0 0 6px #888; }
        .vinyl.playing { animation:spin 5s linear infinite; }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        .vinyl-center-img { width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,0.9); object-fit:cover; background:#fff; }
        .player-controls { display:flex; justify-content:center; gap:12px; margin-bottom:6px; }
        .player-controls button { background:var(--pink-light); border:1px solid var(--border-color); border-radius:50%; width:32px; height:32px; font-size:14px; cursor:pointer; transition:0.2s; }
        .player-controls button:hover { background:var(--pink); }
        .song-title { font-size:10px; color:var(--text-mid); text-align:center; background:var(--bg-card); padding:2px 8px; border-radius:20px; border:1px solid var(--border-color); display:inline-block; max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .contact-info { margin-top:16px; text-align:center; font-size:12px; border-top:1px dashed var(--border-color); padding-top:12px; }
        .contact-info p { margin:6px 0; } .contact-info a { color:var(--pink-dark); text-decoration:none; } .contact-info a:hover { text-decoration:underline; }
        .right-col { margin-left:calc(var(--sidebar-width) + 40px); margin-right:20px; max-width:900px; }
        .back-btn { display:inline-block; background:var(--pink-light); border:1px solid var(--border-color); border-radius:24px; padding:6px 16px; cursor:pointer; font-size:13px; margin-bottom:16px; text-decoration:none; color:var(--text-dark); }
        .back-btn:hover { background:var(--pink); }
        .article-card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:32px; box-shadow:var(--shadow); }
        .article-card h1 { font-size:24px; color:var(--text-dark); margin-bottom:8px; }
        .article-card .meta { font-size:13px; color:var(--text-light); margin-bottom:20px; padding-bottom:16px; border-bottom:2px solid var(--border-color); }
        .article-card .body { font-size:15px; line-height:1.8; color:var(--text-dark); }
        .article-card .body h2 { font-size:20px; margin:24px 0 12px; color:var(--pink-dark); }
        .article-card .body ul { padding-left:24px; margin:12px 0; }
        .article-card .body li { padding:6px 0; }
        .article-card .body img { max-width:100%; border-radius:8px; margin:12px 0; }
        .article-card .body a { color:var(--pink-dark); }
        .article-card .body code { background:#fff0f5; padding:2px 6px; border-radius:4px; font-size:.9em; }
        @media (max-width:800px) { .left-col { display:none; } .right-col { margin-left:20px; } }
        @media (max-width:768px) { nav .links li a { padding:6px 20px; font-size:12px; } }
    </style>
</head>
<body>
    <nav>
        <ul class="links">
            <li><a href="index.html" style="background-color:#FF4D4D;">主页</a></li>
            <li><a href="moments.html" style="background-color:#FFA500;">动态</a></li>
            <li><a href="projects.html" style="background-color:#FFD700;">项目</a></li>
            <li><a href="works.html" style="background-color:#32CD32;">作品集</a></li>
            <li><a href="posts.html" style="background-color:#00CED1;">帖子</a></li>
            <li><a href="thanks.html" style="background-color:#1E90FF;">致谢</a></li>
            <li><a href="repo.html" style="background-color:#9370DB;">仓库</a></li>
        </ul>
    </nav>

    <div class="left-col">
        <div class="profile-card">
            <div class="profile-avatar"><img src="images/lingsheqianbai.jpg" alt="凌社千白"></div>
            <div class="profile-name">凌社千白</div>
            <div class="profile-signature">分享 · 记录 · 创造</div>
            <div class="player">
                <div class="vinyl" id="vinylDisc"><img src="images/yonri.jpg" alt="友利奈绪" class="vinyl-center-img"></div>
                <div class="player-controls">
                    <button id="prevBtn">⏮</button><button id="playPauseBtn">▶️</button><button id="nextBtn">⏭</button>
                </div>
                <div class="song-title" id="songTitle">Morning BGM</div>
            </div>
            <div class="contact-info">
                <p>📺 B站: <a href="https://space.bilibili.com/498508670" target="_blank">凌社千白</a></p>
                <p>🎵 抖音: <a href="https://www.douyin.com/user/self" target="_blank">凌社千白</a></p>
                <p>📱 快手: <a href="https://www.kuaishou.com/profile/3xcatpzc2ejba82" target="_blank">凌社千白</a></p>
            </div>
        </div>
    </div>

    <div class="right-col">
        <a href="posts.html" id="backLink" class="back-btn">← 返回帖子列表</a>
        <div class="article-card">
            <h1 id="postTitle">加载中...</h1>
            <div class="meta" id="postMeta"></div>
            <div class="body" id="postBody"></div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>
    <script>
        // 音乐播放器
        const playlist=[{title:"Morning BGM",url:"music/morning.mp3"},{title:"Night BGM",url:"music/night.mp3"}];
        let currentTrack=0;
        const audio=document.getElementById('audioPlayer'),vinyl=document.getElementById('vinylDisc'),
              playPauseBtn=document.getElementById('playPauseBtn'),prevBtn=document.getElementById('prevBtn'),
              nextBtn=document.getElementById('nextBtn'),songTitleSpan=document.getElementById('songTitle');
        function loadTrack(i){const t=playlist[i%playlist.length];audio.src=t.url;songTitleSpan.textContent=t.title;audio.load();if(!audio.paused){audio.play().catch(()=>{});vinyl.classList.add('playing');playPauseBtn.textContent='⏸️';}else{playPauseBtn.textContent='▶️';vinyl.classList.remove('playing');}}
        playPauseBtn.addEventListener('click',()=>{if(audio.paused){audio.play().then(()=>{vinyl.classList.add('playing');playPauseBtn.textContent='⏸️';}).catch(()=>{});}else{audio.pause();vinyl.classList.remove('playing');playPauseBtn.textContent='▶️';}});
        prevBtn.addEventListener('click',()=>{currentTrack=(currentTrack-1+playlist.length)%playlist.length;loadTrack(currentTrack);});
        nextBtn.addEventListener('click',()=>{currentTrack=(currentTrack+1)%playlist.length;loadTrack(currentTrack);});
        loadTrack(currentTrack);

        // 文章加载
        const postId=new URLSearchParams(window.location.search).get('id');
        if(!postId){document.getElementById('postTitle').textContent='未指定帖子';document.getElementById('postBody').innerHTML='<p>请从帖子列表点击进入。</p>';}
        else{(async()=>{
            const sources=['data/posts.json','data/Project%20Zomboid/mod_posts.json','data/Minecraft/mod_posts.json'];
            let post=null;
            for(const src of sources){try{const r=await fetch(src);if(!r.ok)continue;const d=await r.json();post=d.find(p=>p.id==postId);if(post)break;}catch(e){continue;}}
            if(post){
                document.title=post.title+' - 千白分享';
                document.getElementById('postTitle').textContent=post.title;
                document.getElementById('postMeta').innerHTML='📅 '+post.date;
                document.getElementById('postBody').innerHTML=post.content;
                const bl=document.getElementById('backLink');
                if(post.id&&post.id.startsWith('changelog-')){bl.href='repo.html';bl.textContent='← 返回仓库';}
            }else{document.getElementById('postTitle').textContent='未找到';document.getElementById('postBody').innerHTML='<p>帖子不存在。</p>';}
        })().catch(e=>{document.getElementById('postTitle').textContent='加载失败';document.getElementById('postBody').innerHTML='<p>数据加载失败</p>';});}
    </script>
</body>
</html>
