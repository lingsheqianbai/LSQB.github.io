<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目 - 千白分享</title>
    <style>
        /* ========== 基础风格（固定背景） ========== */
        :root {
            --sidebar-width: 260px;
            --nav-offset: 60px;
            --border-color: #000;
            --bg-card: #fff;
            --bg-sidebar: #fff;
            --text-dark: #2a1a2e;
            --text-mid: #5a3e4b;
            --text-light: #bba3ad;
            --shadow: 4px 4px 0 rgba(0,0,0,0.1);
            --pink: #f9bddd;
            --pink-dark: #c44569;
            --pink-light: #ffcfe2;
        }

        @font-face {
            font-family: 'ZQKNNY';
            src: url('ZQKNNY-Medium-2.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "MS PGothic", "Unifont", "SimSun", "Microsoft YaHei", "ZQKNNY", sans-serif;
            background: url('images/beijin1.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding-top: var(--nav-offset);
            color: var(--text-dark);
        }

        /* 导航栏（彩虹色） */
        nav {
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 999;
            background: #fff;
            border-bottom: 2px solid #000;
        }
        nav .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            list-style: none;
            padding: 8px 16px;
            margin: 0;
            gap: 12px;
        }
        nav .links li a {
            display: inline-block;
            padding: 8px 32px;
            border-radius: 32px;
            border: 1px solid #000;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
            transition: filter 0.2s;
            cursor: pointer;
        }
        nav .links li a:hover { filter: brightness(0.85); }

        /* 左侧栏 */
        .left-col {
            position: fixed;
            left: 20px;
            top: var(--nav-offset);
            width: var(--sidebar-width);
            z-index: 950;
        }
        .profile-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        .profile-avatar {
            text-align: center;
            margin-bottom: 8px;
        }
        .profile-avatar img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }
        .profile-name { font-size: 18px; font-weight: bold; text-align: center; color: var(--text-dark); }
        .profile-signature { font-size: 11px; text-align: center; color: var(--text-mid); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-color); }

        /* 播放器 */
        .player {
            margin: 16px 0 12px;
            text-align: center;
        }
        .vinyl {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 35%, #222, #111);
            border-radius: 50%;
            box-shadow: 0 0 0 4px #444, 0 0 0 6px #888;
        }
        .vinyl.playing {
            animation: spin 5s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .vinyl-center-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.9);
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
            background: #fff;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .player-controls button {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-dark);
            transition: 0.2s;
        }
        .player-controls button:hover { background: var(--pink); }
        .song-title {
            font-size: 10px;
            color: var(--text-mid);
            text-align: center;
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: inline-block;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 右侧主区域 */
        .right-col {
            margin-left: calc(var(--sidebar-width) + 40px);
            margin-right: 20px;
            max-width: 1200px;
        }
        .page-header {
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }
        .page-header h2 {
            font-size: 24px;
            display: inline-block;
            background: var(--pink-light);
            padding: 4px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        /* 项目卡片网格 */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .project-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }
        .project-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-dark);
        }
        .project-desc {
            font-size: 13px;
            color: var(--text-mid);
            line-height: 1.5;
        }

        @media (max-width: 800px) {
            .left-col { display: none; }
            .right-col { margin-left: 20px; }
            .projects-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            nav .links li a { padding: 6px 20px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <nav>
        <ul class="links">
            <li><a href="index.html" style="background-color: #FF4D4D;">主页</a></li>
            <li><a href="moments.html" style="background-color: #FFA500;">动态</a></li>
            <li><a href="projects.html" style="background-color: #FFD700;">项目</a></li>
            <li><a href="#" style="background-color: #32CD32;">作品集</a></li>
            <li><a href="#" style="background-color: #00CED1;">联系</a></li>
            <li><a href="#" style="background-color: #1E90FF;">致谢</a></li>
            <li><a href="https://github.com/lingsheqianbai/lingsheqianbai.github.io" target="_blank" rel="noopener noreferrer" style="background-color: #9370DB;">仓库</a></li>
        </ul>
    </nav>

    <div class="left-col">
        <div class="profile-card">
            <div class="profile-avatar">
                <img src="images/lingsheqianbai.jpg" alt="凌社千白">
            </div>
            <div class="profile-name">凌社千白</div>
            <div class="profile-signature">分享 · 记录 · 创造</div>
            <div class="player">
                <div class="vinyl" id="vinylDisc">
                    <img src="images/yonri.jpg" alt="友利奈绪" class="vinyl-center-img">

    <div class="right-col">
        <div class="page-header">
            <h2>📂 项目展示</h2>
        </div>
        <div class="projects-grid">
            <div class="project-card" onclick="location.href='#';">
                <div class="project-icon">🎮</div>

    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        // ==================== 音乐播放器（与主页相同） ====================
        const playlist = [
            { title: "Morning BGM", url: "music/morning.mp3" },
            { title: "Night BGM", url: "music/night.mp3" }
        ];
        let currentTrack = 0;
        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songTitleSpan = document.getElementById('songTitle');

        function loadTrack(index) {
            const track = playlist[index % playlist.length];
            audio.src = track.url;
            songTitleSpan.textContent = track.title;
            audio.load();
            if (!audio.paused) {
                audio.play().catch(() => {});
                vinyl.classList.add('playing');
                playPauseBtn.textContent = '⏸️';
            } else {
                playPauseBtn.textContent = '▶️';
                vinyl.classList.remove('playing');
            }
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    vinyl.classList.add('playing');
                    playPauseBtn.textContent = '⏸️';
                }).catch(() => {});
            } else {
                audio.pause();
                vinyl.classList.remove('playing');
                playPauseBtn.textContent = '▶️';
            }
        });

        prevBtn.addEventListener('click', () => {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack);
        });

        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadTrack(currentTrack);
        });

        loadTrack(currentTrack);
    </script>
