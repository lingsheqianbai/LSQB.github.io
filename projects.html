<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目 - 千白分享</title>
    <style>
        /* ========== 基础风格 ========== */
        :root {
            --sidebar-width: 260px;
            --nav-offset: 60px;
            --border-color: #000;
            --bg-card: #fff;
            --bg-sidebar: #fff;
            --text-dark: #2a1a2e;
            --text-mid: #5a3e4b;
            --text-light: #bba3ad;
            --shadow: 4px 4px 0 rgba(0,0,0,0.1);
            --pink: #f9bddd;
            --pink-dark: #c44569;
            --pink-light: #ffcfe2;
        }

        @font-face {
            font-family: 'ZQKNNY';
            src: url('ZQKNNY-Medium-2.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "MS PGothic", "Unifont", "SimSun", "Microsoft YaHei", "ZQKNNY", sans-serif;
            background: url('images/beijin1.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding-top: var(--nav-offset);
            color: var(--text-dark);
        }

        nav {
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 999;
            background: #fff;
            border-bottom: 2px solid #000;
        }
        nav .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            list-style: none;
            padding: 8px 16px;
            margin: 0;
            gap: 12px;
        }
        nav .links li a {
            display: inline-block;
            padding: 8px 32px;
            border-radius: 32px;
            border: 1px solid #000;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
            transition: filter 0.2s;
            cursor: pointer;
        }
        nav .links li a:hover { filter: brightness(0.85); }

        .left-col {
            position: fixed;
            left: 20px;
            top: var(--nav-offset);
            width: var(--sidebar-width);
            z-index: 950;
        }
        .profile-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        .profile-avatar {
            text-align: center;
            margin-bottom: 8px;
        }
        .profile-avatar img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }
        .profile-name { font-size: 18px; font-weight: bold; text-align: center; color: var(--text-dark); }
        .profile-signature { font-size: 11px; text-align: center; color: var(--text-mid); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-color); }

        .player {
            margin: 16px 0 12px;
            text-align: center;
        }
        .vinyl {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 35%, #222, #111);
            border-radius: 50%;
            box-shadow: 0 0 0 4px #444, 0 0 0 6px #888;
        }
        .vinyl.playing {
            animation: spin 5s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .vinyl-center-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.9);
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
            background: #fff;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .player-controls button {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .player-controls button:hover { background: var(--pink); }
        .song-title {
            font-size: 10px;
            color: var(--text-mid);
            text-align: center;
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: inline-block;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .right-col {
            margin-left: calc(var(--sidebar-width) + 40px);
            margin-right: 20px;
            max-width: 1200px;
        }
        .page-header {
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h2 {
            font-size: 24px;
            display: inline-block;
            background: var(--pink-light);
            padding: 4px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .search-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-bar input {
            border: none;
            background: none;
            outline: none;
            font-size: 13px;
            width: 180px;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .project-icon { font-size: 36px; margin-bottom: 12px; }
        .project-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .project-desc { font-size: 13px; color: var(--text-mid); line-height: 1.5; }

        /* 详情视图 */
        .detail-view {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        .back-btn {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 16px;
            display: inline-block;
        }
        .content-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .content-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .content-title {
            font-weight: bold;
            font-size: 15px;
        }
        .content-subtitle {
            font-size: 12px;
            color: var(--text-mid);
            margin-left: 8px;
        }
        .content-links {
            margin-top: 6px;
            display: flex;
            gap: 12px;
            font-size: 12px;
        }
        .content-links a {
            color: var(--pink-dark);
            text-decoration: none;
        }
        .content-note {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .empty-tip {
            text-align: center;
            padding: 40px;
            color: var(--text-mid);
        }

        @media (max-width: 800px) {
            .left-col { display: none; }
            .right-col { margin-left: 20px; }
        }
        @media (max-width: 768px) {
            nav .links li a { padding: 6px 20px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <nav>
        <ul class="links">
            <li><a href="index.html" style="background-color: #FF4D4D;">主页</a></li>
            <li><a href="moments.html" style="background-color: #FFA500;">动态</a></li>
            <li><a href="projects.html" style="background-color: #FFD700;">项目</a></li>
            <li><a href="#" style="background-color: #32CD32;">作品集</a></li>
            <li><a href="#" style="background-color: #00CED1;">联系</a></li>
            <li><a href="#" style="background-color: #1E90FF;">致谢</a></li>
            <li><a href="https://github.com/lingsheqianbai/lingsheqianbai.github.io" target="_blank" style="background-color: #9370DB;">仓库</a></li>
        </ul>
    </nav>

    <div class="left-col">
        <div class="profile-card">
            <div class="profile-avatar"><img src="images/lingsheqianbai.jpg" alt="凌社千白"></div>
            <div class="profile-name">凌社千白</div>
            <div class="profile-signature">分享 · 记录 · 创造</div>
            <div class="player">
                <div class="vinyl" id="vinylDisc"><img src="images/yonri.jpg" alt="友利奈绪" class="vinyl-center-img"></div>
                <div class="player-controls">
                    <button id="prevBtn">⏮</button>
                    <button id="playPauseBtn">▶️</button>
                    <button id="nextBtn">⏭</button>
                </div>
                <div class="song-title" id="songTitle">Morning BGM</div>
            </div>
        </div>
    </div>

    <div class="right-col">
        <div class="page-header">
            <h2>📂 项目展示</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索游戏...">
                <span>🔍</span>
            </div>
        </div>

        <!-- 游戏卡片列表 -->
        <div id="gamesGridView">
            <div class="projects-grid" id="gamesGrid">加载中...</div>
        </div>

        <!-- 游戏详情视图（初始隐藏） -->
        <div id="gameDetailView" style="display: none;">
            <div class="detail-view">
                <button class="back-btn" id="backToGridBtn">← 返回游戏列表</button>
                <h3 id="detailGameName" style="margin-bottom: 16px;"></h3>
                <div id="detailContent" class="content-list"></div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        // ---------- 音乐播放器 ----------
        const playlist = [
            { title: "Morning BGM", url: "music/morning.mp3" },
            { title: "Night BGM", url: "music/night.mp3" }
        ];
        let currentTrack = 0;
        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songTitleSpan = document.getElementById('songTitle');

        function loadTrack(index) {
            const track = playlist[index % playlist.length];
            audio.src = track.url;
            songTitleSpan.textContent = track.title;
            audio.load();
            if (!audio.paused) {
                audio.play().catch(()=>{});
                vinyl.classList.add('playing');
                playPauseBtn.textContent = '⏸️';
            } else {
                playPauseBtn.textContent = '▶️';
                vinyl.classList.remove('playing');
            }
        }
        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => { vinyl.classList.add('playing'); playPauseBtn.textContent = '⏸️'; }).catch(()=>{});
            } else {
                audio.pause();
                vinyl.classList.remove('playing');
                playPauseBtn.textContent = '▶️';
            }
        });
        prevBtn.addEventListener('click', () => { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; loadTrack(currentTrack); });
        nextBtn.addEventListener('click', () => { currentTrack = (currentTrack + 1) % playlist.length; loadTrack(currentTrack); });
        loadTrack(currentTrack);

        // ---------- 项目页面核心逻辑 ----------
        let gamesData = [];
        let currentFilter = '';

        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const res = await fetch('data/games.json');
                if (!res.ok) throw new Error();
                gamesData = await res.json();
                renderGameCards();
            } catch (err) {
                grid.innerHTML = '<div style="text-align:center; padding:20px;">加载失败，请检查 data/games.json</div>';
            }
        }

        function renderGameCards() {
            const grid = document.getElementById('gamesGrid');
            const filtered = gamesData.filter(g => 
                currentFilter === '' || g.name.includes(currentFilter)
            );
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="text-align:center; padding:20px;">没有找到相关游戏</div>';
                return;
            }
            grid.innerHTML = filtered.map(g => `
                <div class="project-card" data-id="${g.id}">
                    <div class="project-icon">${g.icon || '🎮'}</div>
                    <div class="project-title">${escapeHtml(g.name)}</div>
                    <div class="project-desc">${escapeHtml(g.description)}</div>
                </div>
            `).join('');

            // 绑定卡片点击事件
            document.querySelectorAll('.project-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.id;
                    const game = gamesData.find(g => g.id === id);
                    if (game) showGameDetail(game);
                });
            });
        }

        function showGameDetail(game) {
            document.getElementById('gamesGridView').style.display = 'none';
            document.getElementById('gameDetailView').style.display = 'block';
            document.getElementById('detailGameName').innerHTML = `${game.icon || '🎮'} ${escapeHtml(game.name)}`;
            const contentDiv = document.getElementById('detailContent');
            if (!game.content || game.content.length === 0) {
                contentDiv.innerHTML = '<div class="empty-tip">暂无内容，后续补充~</div>';
                return;
            }
            contentDiv.innerHTML = game.content.map(item => {
                let typeLabel = '';
                switch(item.type) {
                    case 'mod': typeLabel = '📦 模组'; break;
                    case 'guide': typeLabel = '📖 攻略'; break;
                    case 'wonder': typeLabel = '🐉 精灵'; break;
                    case 'task': typeLabel = '📜 任务'; break;
                    case 'activity': typeLabel = '🎉 活动'; break;
                    case 'title': typeLabel = '🏅 称号'; break;
                    default: typeLabel = '🔹';
                }
                let linksHtml = '';
                if (item.url) linksHtml += `<a href="${item.url}" target="_blank">🔗 详情</a>`;
                if (item.video) linksHtml += `<a href="${item.video}" target="_blank">🎬 视频</a>`;
                return `
                    <div class="content-item">
                        <div><span class="content-title">${escapeHtml(item.title)}</span><span class="content-subtitle">${item.subtitle ? escapeHtml(item.subtitle) : ''}</span></div>
                        <div class="content-links">${linksHtml || '—'}</div>
                        ${item.note ? `<div class="content-note">📝 ${escapeHtml(item.note)}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function backToGrid() {
            document.getElementById('gamesGridView').style.display = 'block';
            document.getElementById('gameDetailView').style.display = 'none';
            // 可选：重置搜索
            // document.getElementById('searchInput').value = '';
            // currentFilter = '';
            // renderGameCards();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentFilter = e.target.value;
            renderGameCards();
        });
        document.getElementById('backToGridBtn').addEventListener('click', backToGrid);

        loadGames();
    </script>
</body>
</html>
