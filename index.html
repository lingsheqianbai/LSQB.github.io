<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千白分享主页</title>
    <style>
        /* ========== 基础风格 ========== */
        :root {
            --sidebar-width: 260px;
            --nav-offset: 60px;
            --border-color: #000;
            --bg-card: #fff;
            --bg-sidebar: #fff;
            --text-dark: #2a1a2e;
            --text-mid: #5a3e4b;
            --text-light: #bba3ad;
            --shadow: 4px 4px 0 rgba(0,0,0,0.1);
            --pink: #f9bddd;
            --pink-dark: #c44569;
            --pink-light: #ffcfe2;
        }

        @font-face {
            font-family: 'ZQKNNY';
            src: url('ZQKNNY-Medium-2.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "MS PGothic", "Unifont", "SimSun", "Microsoft YaHei", "ZQKNNY", sans-serif;
            background: url('images/beijin1.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding-top: var(--nav-offset);
            color: var(--text-dark);
        }

        /* 导航栏 */
        nav {
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 999;
            background: #fff;
            border-bottom: 2px solid #000;
        }
        nav .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            list-style: none;
            padding: 8px 16px;
            margin: 0;
            gap: 12px;
        }
        nav .links li a {
            display: inline-block;
            padding: 8px 32px;
            border-radius: 32px;
            border: 1px solid #000;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
            transition: filter 0.2s;
            cursor: pointer;
        }
        nav .links li a:hover { filter: brightness(0.85); }

        /* 左侧栏 */
        .left-col {
            position: fixed;
            left: 20px;
            top: var(--nav-offset);
            width: var(--sidebar-width);
            z-index: 950;
        }
        .profile-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        .profile-avatar {
            text-align: center;
            margin-bottom: 8px;
        }
        .profile-avatar img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }
        .profile-name { font-size: 18px; font-weight: bold; text-align: center; }
        .profile-signature { font-size: 11px; text-align: center; color: var(--text-mid); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-color); }

        /* 播放器 */
        .player {
            margin: 16px 0 12px;
            text-align: center;
        }
        .vinyl {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 35%, #222, #111);
            border-radius: 50%;
            box-shadow: 0 0 0 4px #444, 0 0 0 6px #888;
        }
        .vinyl.playing {
            animation: spin 5s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .vinyl-center-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.9);
            object-fit: cover;
            background: #fff;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .player-controls button {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .player-controls button:hover { background: var(--pink); }
        .song-title {
            font-size: 10px;
            color: var(--text-mid);
            text-align: center;
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: inline-block;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 联系方式 */
        .contact-info {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
        }
        .contact-info p {
            margin: 6px 0;
        }
        .contact-info a {
            color: var(--pink-dark);
            text-decoration: none;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }

        /* 右侧主区域 */
        .right-col {
            margin-left: calc(var(--sidebar-width) + 40px);
            margin-right: 20px;
            max-width: 1200px;
        }
        .banner {
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .banner-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        .compact-calendar .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .compact-calendar .cal-header button {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2px 12px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }
        .compact-calendar .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }
        .compact-calendar .weekday {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-dark);
            padding: 4px;
        }
        .compact-calendar .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day {
            text-align: center;
            padding: 4px 0;
            background: var(--bg-card);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            border: 1px solid var(--border-color);
            transition: 0.1s;
        }
        .calendar-day.today {
            background: var(--pink);
            color: #fff;
            font-weight: bold;
        }
        .announcement h3 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .announcement p {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-mid);
            margin-bottom: 10px;
        }
        .moment-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .moment-item:hover { transform: translateY(-2px); }
        .moment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .moment-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--pink-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid var(--border-color);
        }
        .moment-info { flex: 1; }
        .moment-nickname { font-weight: bold; font-size: 15px; color: var(--text-dark); }
        .moment-time { font-size: 11px; color: var(--text-mid); }
        .moment-content { font-size: 14px; line-height: 1.6; margin-bottom: 12px; color: var(--text-dark); }
        .moment-images { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .moment-images img { max-width: calc(33% - 8px); border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s; }
        .moment-images img:hover { transform: scale(1.02); }
        .moment-stats { font-size: 12px; color: var(--text-light); border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 4px; }
        .moments-more { text-align: center; margin-top: 8px; }
        .moments-more a { display: inline-block; background: var(--pink-light); padding: 6px 16px; border-radius: 24px; text-decoration: none; color: var(--text-dark); font-size: 12px; font-weight: bold; border: 1px solid var(--border-color); }
        .moments-more a:hover { background: var(--pink); }
        .sponsor-block { margin-top: 24px; margin-bottom: 24px; }
        .sponsor-summary {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        .sponsor-summary:hover { background: var(--pink); }
        .sponsor-summary::after { content: '▼'; margin-left: auto; font-size: 12px; transition: transform 0.2s; }
        .sponsor-block.open .sponsor-summary::after { transform: rotate(180deg); }
        .sponsor-content { display: none; background: var(--bg-card); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 12px 12px; padding: 16px; text-align: center; }
        .sponsor-block.open .sponsor-content { display: block; }
        .sponsor-img { max-width: 180px; border-radius: 10px; border: 1px solid var(--border-color); background: #fff; padding: 4px; cursor: pointer; }

        @media (max-width: 800px) {
            .left-col { display: none; }
            .right-col { margin-left: 20px; }
            .two-columns { grid-template-columns: 1fr; }
            .moment-images img { max-width: calc(50% - 8px); }
        }
        @media (max-width: 768px) {
            nav .links li a { padding: 6px 20px; font-size: 12px; }
            .song-title { max-width: 150px; }
        }
    </style>
</head>
<body>
    <nav>
        <ul class="links">
            <li><a href="index.html" style="background-color: #FF4D4D;">主页</a></li>
            <li><a href="moments.html" style="background-color: #FFA500;">动态</a></li>
            <li><a href="projects.html" style="background-color: #FFD700;">项目</a></li>
            <li><a href="works.html" style="background-color: #32CD32;">作品集</a></li>
            <li><a href="posts.html" style="background-color: #00CED1;">帖子</a></li>
            <li><a href="thanks.html" style="background-color: #1E90FF;">致谢</a></li>
            <li><a href="repo.html" style="background-color: #9370DB;">仓库</a></li>
        </ul>
    </nav>

    <div class="left-col">
        <div class="profile-card">
            <div class="profile-avatar">
                <img src="images/lingsheqianbai.jpg" alt="凌社千白">
            </div>
            <div class="profile-name">凌社千白</div>
            <div class="profile-signature">分享 · 记录 · 创造</div>
            <div class="player">
                <div class="vinyl" id="vinylDisc">
                    <img src="images/yonri.jpg" alt="友利奈绪" class="vinyl-center-img">
                </div>
                <div class="player-controls">
                    <button id="prevBtn">⏮</button>
                    <button id="playPauseBtn">▶️</button>
                    <button id="nextBtn">⏭</button>
                </div>
                <div class="song-title" id="songTitle">Morning BGM</div>
            </div>
            <div class="contact-info">
                <p>📺 B站: <a href="https://space.bilibili.com/498508670?spm_id_from=333.1007.0.0" target="_blank">凌社千白</a></p>
                <p>🎵 抖音: <a href="https://www.douyin.com/user/self/search/%E5%87%8C%E7%A4%BE%E5%8D%83%E7%99%BD?aid=1f8c5d62-63e5-44e7-b317-8c4aea394ea7&type=general" target="_blank">凌社千白</a></p>
                <p>📱 快手: <a href="https://www.kuaishou.com/profile/3xcatpzc2ejba82" target="_blank">凌社千白</a></p>
            </div>
            <button class="theme-toggle" id="themeToggle" style="display: none;">🌙 黑夜</button>
        </div>
    </div>

    <div class="right-col" id="top">
        <div class="banner">
            <img src="images/pngzhuye.png" alt="主页图片" class="banner-img">
        </div>
        <div class="two-columns">
            <div class="card compact-calendar">
                <div class="cal-header">
                    <button id="compactPrevBtn">&lt;</button>
                    <span id="compactMonthYear"></span>
                    <button id="compactNextBtn">&gt;</button>
                </div>
                <div class="weekdays-grid" id="weekdaysGrid"></div>
                <div class="days-grid" id="compactCalendarGrid"></div>
            </div>
            <div class="card announcement">
                <h3>📢 公告栏</h3>
                <p>✨ 网站持续更新中~</p>
                <p>🎉 如果你有建议或发现 Bug，欢迎通过左侧联系方式与我反馈。</p>
                <p>📅 所有的视频源来源B站，因为审核条例比较合理，一些内容可以发布反之快手抖音下架了很多内容。</p>
            </div>
        </div>
        <div id="momentsContainer"></div>
        <div class="sponsor-block" id="sponsorBlock">
            <div class="sponsor-summary">💖 支持一下</div>
            <div class="sponsor-content">
                <img src="sponsor.png" alt="赞赏码" class="sponsor-img" id="sponsorImg" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\'color:var(--text-mid);\'>请放置 sponsor.png 到根目录</span>'">
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        // 音乐播放器
        const playlist = [
            { title: "Morning BGM", url: "music/morning.mp3" },
            { title: "Night BGM", url: "music/night.mp3" }
        ];
        let currentTrack = 0;
        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songTitleSpan = document.getElementById('songTitle');

        function loadTrack(index) {
            const track = playlist[index % playlist.length];
            audio.src = track.url;
            songTitleSpan.textContent = track.title;
            audio.load();
            if (!audio.paused) {
                audio.play().catch(() => {});
                vinyl.classList.add('playing');
                playPauseBtn.textContent = '⏸️';
            } else {
                playPauseBtn.textContent = '▶️';
                vinyl.classList.remove('playing');
            }
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    vinyl.classList.add('playing');
                    playPauseBtn.textContent = '⏸️';
                }).catch(() => {});
            } else {
                audio.pause();
                vinyl.classList.remove('playing');
                playPauseBtn.textContent = '▶️';
            }
        });

        prevBtn.addEventListener('click', () => {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack);
        });

        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadTrack(currentTrack);
        });

        loadTrack(currentTrack);

        // 紧凑周历
        let calendarTargetDate = new Date();
        const weekdayNames = ['日', '一', '二', '三', '四', '五', '六'];
        function updateCompactCalendar(targetDate) {
            const startDate = new Date(targetDate);
            startDate.setDate(targetDate.getDate() - 3);
            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                weekDays.push(date);
            }
            const weekdaysGrid = document.getElementById('weekdaysGrid');
            weekdaysGrid.innerHTML = '';
            weekdayNames.forEach(wd => {
                const div = document.createElement('div');
                div.className = 'weekday';
                div.textContent = wd;
                weekdaysGrid.appendChild(div);
            });
            const daysGrid = document.getElementById('compactCalendarGrid');
            daysGrid.innerHTML = '';
            const today = new Date();
            weekDays.forEach((date) => {
                const isToday = date.toDateString() === today.toDateString();
                const cell = document.createElement('div');
                cell.className = 'calendar-day';
                if (isToday) cell.classList.add('today');
                cell.textContent = `${date.getDate()}`;
                cell.onclick = () => updateCompactCalendar(date);
                daysGrid.appendChild(cell);
            });
            const monthYear = `${targetDate.getFullYear()}年 ${targetDate.getMonth()+1}月`;
            document.getElementById('compactMonthYear').textContent = monthYear;
        }
        document.getElementById('compactPrevBtn').addEventListener('click', () => {
            calendarTargetDate.setDate(calendarTargetDate.getDate() - 7);
            updateCompactCalendar(calendarTargetDate);
        });
        document.getElementById('compactNextBtn').addEventListener('click', () => {
            calendarTargetDate.setDate(calendarTargetDate.getDate() + 7);
            updateCompactCalendar(calendarTargetDate);
        });
        updateCompactCalendar(calendarTargetDate);

        // 动态加载
        async function loadMoments() {
            const container = document.getElementById('momentsContainer');
            const defaultMoments = [
                { avatar: "📦", nickname: "凌社千白", time: "2026-06-02T14:30:00+08:00", content: "主页终于重构完成！加了日历、公告栏，还有动态区域，以后可以在这里记录日常啦~", images: [], likes: 5, comments: 2 },
                { avatar: "📦", nickname: "凌社千白", time: "2026-06-01T09:15:00+08:00", content: "洛克王国精灵图鉴已更新至127种，点击项目页面可查看详情。", images: [], likes: 3, comments: 1 },
                { avatar: "📦", nickname: "凌社千白", time: "2026-05-30T20:00:00+08:00", content: "模组信息统计新增离线分享筛选功能，方便查询已上传的模组。", images: [], likes: 2, comments: 0 }
            ];
            let moments = [];
            try {
                const res = await fetch('data/moments.json');
                if (res.ok) moments = await res.json();
                else throw new Error();
            } catch (err) {
                moments = defaultMoments;
            }
            const recent = moments.sort((a,b) => new Date(b.time) - new Date(a.time)).slice(0, 3);
            if (recent.length === 0) {
                container.innerHTML = '<div class="card" style="text-align:center; padding:20px;">暂无动态，敬请期待~</div>';
                return;
            }
            let html = '';
            recent.forEach(m => {
                const imagesHtml = (m.images && m.images.length) ? 
                    `<div class="moment-images">${m.images.map(img => `<img src="${img}" alt="配图" loading="lazy" onclick="showImageModal(this.src)">`).join('')}</div>` : '';
                html += `
                    <div class="moment-item">
                        <div class="moment-header">
                            <div class="moment-avatar">${escapeHtml(m.avatar || '📦')}</div>
                            <div class="moment-info">
                                <div class="moment-nickname">${escapeHtml(m.nickname || '凌社千白')}</div>
                                <div class="moment-time">${formatTime(m.time)}</div>
                            </div>
                        </div>
                        <div class="moment-content">${escapeHtml(m.content)}</div>
                        ${imagesHtml}
                        <div class="moment-stats"><span>❤️ ${m.likes || 0}</span>&nbsp;&nbsp;<span>💬 ${m.comments || 0}</span></div>
                    </div>
                `;
            });
            html += `<div class="moments-more"><a href="moments.html">📲 查看更多动态</a></div>`;
            container.innerHTML = html;
        }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        function formatTime(iso) {
            if (!iso) return '';
            const date = new Date(iso), now = new Date();
            const diff = (now - date) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return `${Math.floor(diff/60)}分钟前`;
            if (diff < 86400) return `${Math.floor(diff/3600)}小时前`;
            if (diff < 86400*7) return `${Math.floor(diff/86400)}天前`;
            return `${date.getMonth()+1}月${date.getDate()}日`;
        }
        window.showImageModal = function(src) {
            const modal = document.createElement('div');
            modal.style.position = 'fixed'; modal.style.top = '0'; modal.style.left = '0'; modal.style.width = '100%'; modal.style.height = '100%';
            modal.style.backgroundColor = 'rgba(0,0,0,0.85)'; modal.style.display = 'flex'; modal.style.alignItems = 'center'; modal.style.justifyContent = 'center'; modal.style.zIndex = '10000';
            const img = document.createElement('img'); img.src = src; img.style.maxWidth = '90%'; img.style.maxHeight = '90%'; img.style.border = '2px solid #fff'; img.style.borderRadius = '8px';
            modal.appendChild(img); modal.addEventListener('click', () => modal.remove()); document.body.appendChild(modal);
        };
        loadMoments();

        // 支持一下折叠
        const sponsorBlock = document.getElementById('sponsorBlock');
        const sponsorSummary = document.querySelector('.sponsor-summary');
        sponsorSummary.addEventListener('click', (e) => {
            e.stopPropagation();
            sponsorBlock.classList.toggle('open');
        });
        const sponsorImg = document.getElementById('sponsorImg');
        if (sponsorImg) {
            sponsorImg.addEventListener('click', () => showImageModal(sponsorImg.src));
        }

        // 导航平滑滚动
        document.querySelectorAll('nav .links li a[href="#"]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector('.right-col').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });
    </script>
</body>
</html>
