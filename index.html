<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千白分享主页</title>
    <style>
        /* ========== 基础复古风格 ========== */
        :root {
            --sidebar-width: 260px;
            --nav-offset: 60px;
            --pink: #f9bddd;
            --pink-dark: #c44569;
            --pink-light: #ffcfe2;
            --text-dark: #2a1a2e;
            --text-mid: #5a3e4b;
            --text-light: #bba3ad;
            --border-color: #000;
            --bg-body: navajowhite;
            --bg-card: #fff;
            --bg-sidebar: #fff;
            --shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }
        body.dark {
            --bg-body: #1a1a2e;
            --bg-card: #16213e;
            --bg-sidebar: #0f3460;
            --text-dark: #e2e2e2;
            --text-mid: #b0b0b0;
            --text-light: #888;
            --border-color: #3a3a5a;
            --pink: #c44569;
            --pink-light: #5c2e3a;
            --shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }

        @font-face {
            font-family: 'ZQKNNY';
            src: url('ZQKNNY-Medium-2.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "MS PGothic", "Unifont", "SimSun", "Microsoft YaHei", "ZQKNNY", sans-serif;
            background: var(--bg-body);
            background-image: repeating-conic-gradient(#f9bddd33 0% 25%, transparent 0% 50%) 50% / 40px 40px;
            background-attachment: fixed;
            min-height: 100vh;
            padding-top: var(--nav-offset);
            transition: background 0.3s, color 0.2s;
            color: var(--text-dark);
        }

        /* 导航栏（彩虹色） */
        nav {
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 999;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border-color);
        }
        nav .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            list-style: none;
            padding: 8px 16px;
            margin: 0;
            gap: 12px;
        }
        nav .links li a {
            display: inline-block;
            padding: 8px 32px;
            border-radius: 32px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
            transition: filter 0.2s;
            cursor: pointer;
        }
        nav .links li a:hover { filter: brightness(0.85); }

        /* 左侧栏 */
        .left-col {
            position: fixed;
            left: 20px;
            top: var(--nav-offset);
            width: var(--sidebar-width);
            z-index: 950;
        }
        .profile-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        .profile-avatar { font-size: 64px; text-align: center; margin-bottom: 8px; }
        .profile-name { font-size: 18px; font-weight: bold; text-align: center; color: var(--text-dark); }
        .profile-signature { font-size: 11px; text-align: center; color: var(--text-mid); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-color); }

        /* 播放器 */
        .player { margin: 16px 0 12px; text-align: center; }
        .vinyl {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #222, #111);
            box-shadow: 0 0 0 4px #444, 0 0 0 6px #888;
            margin: 0 auto 8px;
            animation: spin 0s linear infinite;
        }
        .vinyl.playing { animation: spin 5s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .player-controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 6px; }
        .player-controls button {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-dark);
            transition: 0.2s;
        }
        .player-controls button:hover { background: var(--pink); }
        .song-title { font-size: 10px; color: var(--text-mid); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .theme-toggle {
            width: 100%;
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-dark);
            text-align: center;
            margin-top: 8px;
            transition: 0.2s;
        }
        .theme-toggle:hover { background: var(--pink); }

        /* 右侧主区域（极简） */
        .right-col {
            margin-left: calc(var(--sidebar-width) + 40px);
            margin-right: 20px;
            max-width: 800px;
        }
        /* Banner 空白框 */
        .banner {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            color: var(--text-mid);
            font-size: 14px;
        }
        /* 双列：日历 + 公告栏 */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        /* 紧凑周历 */
        .compact-calendar .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .compact-calendar .cal-header button {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2px 12px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }
        .compact-calendar .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }
        .compact-calendar .weekday {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-dark);
            padding: 4px;
        }
        .compact-calendar .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day {
            text-align: center;
            padding: 4px 0;
            background: var(--bg-card);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            border: 1px solid var(--border-color);
            transition: 0.1s;
        }
        .calendar-day.today {
            background: var(--pink);
            color: #fff;
            font-weight: bold;
        }
        /* 公告栏 */
        .announcement h3 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .announcement p {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-mid);
            margin-bottom: 10px;
        }
        /* 响应式 */
        @media (max-width: 800px) {
            .left-col { display: none; }
            .right-col { margin-left: 20px; }
            .two-columns { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            nav .links li a { padding: 6px 20px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <!-- 彩虹导航栏 -->
    <nav>
        <ul class="links">
            <li><a href="#" data-target="top" style="background-color: #FF4D4D;">主页</a></li>
            <li><a href="#" data-target="top" style="background-color: #FFA500;">项目</a></li>
            <li><a href="#" data-target="top" style="background-color: #FFD700;">帖子</a></li>
            <li><a href="#" data-target="top" style="background-color: #32CD32;">作品集</a></li>
            <li><a href="#" data-target="top" style="background-color: #00CED1;">联系</a></li>
            <li><a href="#" data-target="top" style="background-color: #1E90FF;">致谢</a></li>
            <li><a href="https://github.com/lingsheqianbai/lingsheqianbai.github.io" target="_blank" rel="noopener noreferrer" style="background-color: #9370DB;">仓库</a></li>
        </ul>
    </nav>

    <!-- 左侧栏 -->
    <div class="left-col">
        <div class="profile-card">
            <div class="profile-avatar">📦</div>
            <div class="profile-name">凌社千白</div>
            <div class="profile-signature">分享 · 记录 · 创造</div>
            <!-- 黑胶唱片播放器 -->
            <div class="player">
                <div class="vinyl" id="vinylDisc"></div>
                <div class="player-controls">
                    <button id="prevBtn">⏮</button>
                    <button id="playPauseBtn">▶️</button>
                    <button id="nextBtn">⏭</button>
                </div>
                <div class="song-title" id="songTitle">加载中...</div>
            </div>
            <!-- 主题切换 -->
            <button class="theme-toggle" id="themeToggle">🌤️ 白天</button>
        </div>
    </div>

    <!-- 右侧主区域 -->
    <div class="right-col" id="top">
        <!-- Banner 图片占位 -->
        <div class="banner">
            🖼️ 图片占位区（可替换为横幅图像）
        </div>

        <!-- 双列：日历 + 公告栏 -->
        <div class="two-columns">
            <!-- 紧凑周历 -->
            <div class="card compact-calendar">
                <div class="cal-header">
                    <button id="compactPrevBtn">&lt;</button>
                    <span id="compactMonthYear"></span>
                    <button id="compactNextBtn">&gt;</button>
                </div>
                <div class="weekdays-grid" id="weekdaysGrid"></div>
                <div class="days-grid" id="compactCalendarGrid"></div>
            </div>

            <!-- 公告栏 -->
            <div class="card announcement">
                <h3>📢 公告栏</h3>
                <p>✨ 网站正在全面重构中，新功能将陆续上线！感谢大家的关注与支持。</p>
                <p>🎉 如果你有建议或发现 Bug，欢迎通过左侧联系方式与我反馈。</p>
                <p>📅 预计下周发布模组表格和精灵图鉴模块。</p>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        // ==================== 音乐播放器 ====================
        const playlist = [
            { title: "示例曲目 1 - 轻音乐", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "示例曲目 2 - 钢琴曲", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { title: "示例曲目 3 - 吉他", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
        ];
        let currentTrack = 0;
        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songTitleSpan = document.getElementById('songTitle');

        function loadTrack(index) {
            const track = playlist[index % playlist.length];
            audio.src = track.url;
            songTitleSpan.textContent = track.title;
            audio.load();
            audio.play().then(() => {
                playPauseBtn.textContent = '⏸️';
                vinyl.classList.add('playing');
            }).catch(() => {
                playPauseBtn.textContent = '▶️';
                vinyl.classList.remove('playing');
            });
        }
        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.textContent = '⏸️';
                vinyl.classList.add('playing');
            } else {
                audio.pause();
                playPauseBtn.textContent = '▶️';
                vinyl.classList.remove('playing');
            }
        });
        prevBtn.addEventListener('click', () => {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack);
        });
        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadTrack(currentTrack);
        });
        audio.addEventListener('ended', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadTrack(currentTrack);
        });
        loadTrack(0);

        // ==================== 主题切换 ====================
        const themeToggle = document.getElementById('themeToggle');
        let isDark = false;
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            if (isDark) {
                document.body.classList.add('dark');
                themeToggle.innerHTML = '🌙 黑夜';
            } else {
                document.body.classList.remove('dark');
                themeToggle.innerHTML = '🌤️ 白天';
            }
        });

        // ==================== 紧凑周历 ====================
        let calendarTargetDate = new Date();
        const weekdayNames = ['日', '一', '二', '三', '四', '五', '六'];
        function updateCompactCalendar(targetDate) {
            const startDate = new Date(targetDate);
            startDate.setDate(targetDate.getDate() - 3);
            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                weekDays.push(date);
            }
            const weekdaysGrid = document.getElementById('weekdaysGrid');
            weekdaysGrid.innerHTML = '';
            weekdayNames.forEach(wd => {
                const div = document.createElement('div');
                div.className = 'weekday';
                div.textContent = wd;
                weekdaysGrid.appendChild(div);
            });
            const daysGrid = document.getElementById('compactCalendarGrid');
            daysGrid.innerHTML = '';
            const today = new Date();
            weekDays.forEach((date) => {
                const isToday = date.toDateString() === today.toDateString();
                const cell = document.createElement('div');
                cell.className = 'calendar-day';
                if (isToday) cell.classList.add('today');
                cell.textContent = `${date.getDate()}`;
                cell.onclick = () => updateCompactCalendar(date);
                daysGrid.appendChild(cell);
            });
            const monthYear = `${targetDate.getFullYear()}年 ${targetDate.getMonth()+1}月`;
            document.getElementById('compactMonthYear').textContent = monthYear;
        }
        document.getElementById('compactPrevBtn').addEventListener('click', () => {
            calendarTargetDate.setDate(calendarTargetDate.getDate() - 7);
            updateCompactCalendar(calendarTargetDate);
        });
        document.getElementById('compactNextBtn').addEventListener('click', () => {
            calendarTargetDate.setDate(calendarTargetDate.getDate() + 7);
            updateCompactCalendar(calendarTargetDate);
        });
        updateCompactCalendar(calendarTargetDate);

        // 导航点击平滑滚动到顶部
        document.querySelectorAll('nav .links li a[data-target]').forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.getAttribute('data-target') === 'top') {
                    e.preventDefault();
                    document.querySelector('.right-col').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
</html>
